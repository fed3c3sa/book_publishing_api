runtime: python312

# Service name (deploy to a new service, not default)
service: book-publishing-api

# App Engine Standard environment
env: standard

# Automatic scaling configuration (better for memory management)
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6
  target_throughput_utilization: 0.6

# Environment variables
env_variables:
  # Flask configuration
  FLASK_ENV: production
  SECRET_KEY: your_secret_key_here_change_in_production
  
  # File storage
  GCS_BUCKET_NAME: kids-books-data
  
  # OpenAI API (set via gcloud for security)
  # OPENAI_API_KEY: set_via_gcloud_command
  
  # Ideogram API (set via gcloud for security)  
  # IDEOGRAM_API_KEY: set_via_gcloud_command
  
  # Email configuration (set via gcloud for security)
  # EMAIL_USER: set_via_gcloud_command
  # EMAIL_PASSWORD: set_via_gcloud_command
  # ADMIN_EMAIL: set_via_gcloud_command
  # PRODUCTION_EMAIL: set_via_gcloud_command
  
  # Stripe configuration (set via gcloud for security)
  # STRIPE_TEST_SECRET_KEY: set_via_gcloud_command
  # STRIPE_TEST_PUBLISHABLE_KEY: set_via_gcloud_command
  # STRIPE_TEST_WEBHOOK_SECRET: set_via_gcloud_command

# Handler configuration
handlers:
# Static assets
- url: /static
  static_dir: static
  
- url: /favicon\.ico
  static_files: static/favicon.ico
  upload: static/favicon\.ico

# All other requests go to the Flask app
- url: /.*
  script: auto

# Resource limits
resources:
  cpu: 1
  memory_gb: 4
  disk_size_gb: 10

# Health check configuration
readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

# Automatic scaling based on request rate
# Uncomment and adjust if you prefer automatic scaling
# automatic_scaling:
#   min_instances: 0
#   max_instances: 10
#   target_cpu_utilization: 0.6
#   target_throughput_utilization: 0.6 